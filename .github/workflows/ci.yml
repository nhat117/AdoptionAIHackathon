name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev --extra studio --python ${{ matrix.python-version }}
      - run: uv run --frozen --extra dev --extra studio ruff check .
      - run: uv run --frozen --extra dev --extra studio pytest
      - name: Verify corrected offline experiments
        run: |
          uv run --frozen --extra dev --extra studio python scripts/run_corrected_experiments.py
          uv run --frozen --extra dev --extra studio python scripts/replay_corrected_budgets.py
          uv run --frozen --extra dev --extra studio python scripts/report_corrected_budgets.py
          uv run --frozen --extra dev --extra studio python scripts/verify_corrected_artifacts.py
          uv run --frozen --extra dev --extra studio python scripts/run_measurement_v2.py
          uv run --frozen --extra dev --extra studio python scripts/report_measurement_v2.py
          uv run --frozen --extra dev --extra studio python scripts/run_measurement_v2.py --replicate
          uv run --frozen --extra dev --extra studio python scripts/report_measurement_replication.py
          uv run --frozen --extra dev --extra studio python scripts/report_measurement_sensitivity.py
          uv run --frozen --extra dev --extra studio python scripts/run_contract_validation.py
          uv run --frozen --extra dev --extra studio python scripts/run_corrupt_record_validation.py
          uv run --frozen --extra dev --extra studio python scripts/report_validation.py
