[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "adaption-hackathon-starter"
version = "0.1.0"
description = "Reproducible multilingual agent-handoff experiments and registry-backed oversight"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["adaption>=0.19,<1", "python-dotenv>=1,<2", "langgraph>=1,<2"]

[project.optional-dependencies]
studio = ["langgraph-cli[inmem]>=0.4,<1"]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]
reports = ["python-docx>=1,<2", "reportlab>=4,<5", "pillow>=11,<13", "pypdf>=6,<8"]
judge = ["openai>=2,<3"]

[project.scripts]
adaption-starter = "adaption_starter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adaption_starter", "src/ai2ai_injection", "src/ai2ai_guard", "src/swarm_lab"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["research/legacy-v2"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Keep generated Markdown tables and report paragraphs readable in source.
"src/ai2ai_injection/report.py" = ["E501"]
"scripts/summarize_adaption.py" = ["E501"]
