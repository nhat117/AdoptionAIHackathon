[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "adaption-hackathon-starter"
version = "0.1.0"
description = "A small dataset CLI built with the official Adaption Python SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["adaption>=0.19,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]

[project.scripts]
adaption-starter = "adaption_starter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adaption_starter", "src/ai2ai_injection", "src/ai2ai_guard"]

[tool.ruff]
target-version = "py39"
extend-exclude = ["research/legacy-v2"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Keep generated Markdown tables and report paragraphs readable in source.
"src/ai2ai_injection/report.py" = ["E501"]
"scripts/summarize_adaption.py" = ["E501"]
"scripts/run_reference_dataset.py" = ["E501"]

"scripts/report_followup.py" = ["E501"]
"scripts/report_authority600.py" = ["E501"]
"scripts/run_harness_challenge.py" = ["E501"]
"scripts/report_harness_challenge.py" = ["E501"]
"scripts/run_development_calibration.py" = ["E501"]
"scripts/report_development_calibration.py" = ["E501"]
"scripts/run_near_target.py" = ["E501"]
"scripts/report_near_target.py" = ["E501"]
"scripts/run_near_target_confirmation.py" = ["E501"]
"scripts/report_near_target_confirmation.py" = ["E501"]
"scripts/run_context_stress.py" = ["E501"]
"scripts/report_context_stress.py" = ["E501"]
"scripts/run_agent_handoff.py" = ["E501"]
"scripts/run_multilingual_propagation.py" = ["E501"]
"scripts/report_multilingual_propagation.py" = ["E501"]
"scripts/report_agent_handoff.py" = ["E501"]
"src/ai2ai_guard/context.py" = ["E501"]
"scripts/run_oversight_ablation.py" = ["E501"]
"scripts/report_oversight_ablation.py" = ["E501"]
"src/ai2ai_injection/oversight_eval.py" = ["E501"]
